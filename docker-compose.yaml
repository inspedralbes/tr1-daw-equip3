services: 
  client:
    build: ./client
    container_name: pixelplaza-front
    ports:
      - "127.0.0.1:${FRONT_PORT}:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: pixelplaza-back
    ports:
      - "127.0.0.1:${BACK_PORT}:3000"
    environment:
      - PORT=3000