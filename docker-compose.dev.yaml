# Compose para DESARROLLO: cambios en caliente, sin build
services:
  client:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app          # tu código entra en el contenedor
      - /app/node_modules      # los node_modules se quedan dentro del contenedor
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000